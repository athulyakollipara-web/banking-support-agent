[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "banking-support-agent"
version = "0.1.0"
description = "A customer-facing banking support agent: intent model evaluated on Banking77, safe tool use with confirmation and one-time passcodes, human hand-off."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Athulya Kollipara"}]
dependencies = ["langgraph>=0.2", "scikit-learn>=1.4", "numpy>=1.26", "joblib>=1.3", "pyyaml>=6", "fastapi>=0.110",
                "uvicorn>=0.29", "boto3>=1.35"]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "mlflow>=2.14"]
infra = ["aws-cdk-lib>=2.150", "constructs>=10"]

[project.scripts]
bsa = "bsa.cli:main"

[tool.setuptools.packages.find]
include = ["bsa*"]

[tool.setuptools.package-data]
bsa = ["data_hashes.json", "kb/articles.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
