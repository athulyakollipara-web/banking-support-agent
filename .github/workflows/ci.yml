name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: pip install -e ".[dev,infra]"
      - name: Train the intent model (downloads Banking77 and CLINC150, checks pinned hashes)
        run: bsa train
      - name: Tests (policy, guard, agent, scenarios, API, AWS contracts, CDK)
        run: python -m pytest
      - name: Scripted demo
        run: bsa demo

  evaluate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: bsa train
      - name: Held-out intent evaluation (Banking77 test + CLINC150 out-of-scope test)
        run: python eval/intent_eval.py /tmp/intent_eval.json
      - name: Multi-turn scenarios
        run: python eval/run_scenarios.py /tmp/scenarios.json
      - uses: actions/upload-artifact@v6
        with:
          name: eval-results
          path: /tmp/*.json

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Build the Lambda/Docker image (trains the model inside)
        run: docker build -t bsa:ci .
      - name: Run it and hold a short conversation
        run: |
          docker run -d --name agent -p 8080:8080 bsa:ci
          for i in $(seq 1 30); do curl -sf localhost:8080/healthz && break; sleep 1; done
          curl -sf localhost:8080/v1/chat -H "content-type: application/json" -H "x-customer-id: cust_001" \
            -d '{"message":"my new card still has not arrived"}' | tee /tmp/out.json
          python3 -c "import json; r=json.load(open('/tmp/out.json')); assert '9902' in r['reply'], r"
          docker logs agent
